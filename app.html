<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIT - Inventario Tecnológico TRAESA</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0c10;
    }

    #sit {
      display: block;
      border: 0;
      width: 100%;
      height: 100%;
    }

    /* Solo aparece si el panel no llega a cargar (ver el temporizador abajo). */
    #rescate {
      display: none;
      position: fixed;
      inset: 0;
      padding: 2rem 1.5rem;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #f8fafc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    #rescate div {
      max-width: 30rem;
    }

    #rescate p {
      margin: 0 0 1.25rem;
      line-height: 1.55;
      color: #94a3b8;
    }

    #rescate a {
      display: inline-block;
      padding: 0.8rem 1.4rem;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <!--
    Por qué el panel se carga acá dentro y no navegando a script.google.com.

    Cuando el navegador tiene varias cuentas de Google abiertas, Google reescribe
    la dirección del Apps Script de /macros/s/ID/exec a /macros/u/N/s/ID/exec
    para la cuenta activa de la pestaña. Si esa cuenta no es la dueña del script,
    la página muere con el error de Google Drive "No se pudo abrir el archivo en
    este momento", aunque la aplicación sea de acceso anónimo y la dirección
    original funcione. Comprobado: /macros/s/ responde 200 y /macros/u/1/s/
    responde 404 sobre el mismo deployment. Le pasaba a cualquiera que entrara
    con una segunda cuenta, desde que existe el sitio.

    La clave está en el atributo credentialless del marco: el panel se carga SIN
    las cookies de Google, así que Google no ve ninguna sesión, no tiene cuenta
    a la cual reescribir, y sirve la aplicación anónima tal como fue publicada.

    Un marco normal NO alcanza — se probó primero y Google reescribía igual
    dentro del marco. Y credentialless solo surte efecto si esta página se sirve
    con el encabezado Cross-Origin-Embedder-Policy: credentialless, que es
    justamente lo que hace el .htaccess de esta carpeta. Por eso este archivo
    vive en traesa.com/sit/ y no en GitHub Pages, que no permite encabezados
    propios.

    El atributo allow no es decorativo: sin "camera" se rompe la captura de
    fotos de activos y de firmas, que es lo que más se usa desde el celular.
  -->
  <iframe id="sit" credentialless title="SIT - Inventario Tecnológico TRAESA"
    allow="camera; microphone; fullscreen; clipboard-write; geolocation"></iframe>

  <div id="rescate">
    <div>
      <p>El panel está tardando más de lo normal en abrir. Puedes esperar un
        momento más o abrirlo directamente.</p>
      <a id="directo" href="#" target="_blank" rel="noopener">Abrir el SIT directamente</a>
    </div>
  </div>

  <script>
    (function () {
      var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwmP64Da3SMl1h5tU67f2LeOzlQRiYBQGNIaxOMNAZYZJql0wvXuh5uUoQdbduk43x-Ew/exec';

      // Se le pasa al panel la dirección completa tal cual vino: el ticket de
      // entrada del Portal TI, ?activo=, ?admin=true, lo que sea. Si se perdiera
      // acá, el portal mandaría a la gente al login igual.
      var destino = EXEC_URL + window.location.search;

      var marco = document.getElementById('sit');
      marco.src = destino;

      // Escape por si el marco no carga (un navegador viejo sin soporte de
      // credentialless, por ejemplo). Con una sola cuenta de Google la ruta
      // directa funciona bien, que es como se entraba antes.
      var listo = false;
      marco.addEventListener('load', function () { listo = true; });

      document.getElementById('directo').href = destino;
      setTimeout(function () {
        if (!listo) {
          document.getElementById('rescate').style.display = 'flex';
        }
      }, 12000);
    })();
  </script>
</body>

</html>
